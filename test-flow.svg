    <path d="M 200 142.5 V 290 H 575 V 142.5"/>
    <path d="M 637.5 142.5 V 290 H 1015 V 142.5"/>
  </g>
  <g fill="none" class="outline" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 170 150 H 185 M 185 150 L 215 135"/>
    <circle cx="185" cy="150" r="2" class="box"/>
    <circle cx="215" cy="135" r="2" class="box"/>
    <circle cx="215" cy="165" r="2" class="box"/>
    <path d="M 215 133 V 107 H 269 M 215 167 V 205 H 560 V 167"/>
    <path d="M 616 150 H 625 M 625 150 L 650 135"/>
