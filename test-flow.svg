    <circle cx="560" cy="135" r="2" class="box"/>
    <circle cx="560" cy="165" r="2" class="box"/>
    <circle cx="590" cy="150" r="2" class="box"/>
    <path d="M 944 67.5 H 1000 V 133 M 944 202.5 H 1000 V 167 M 1000 135 L 1030 150"/>
    <path d="M 1030 150 H 1050" marker-end="url(#arrow)"/>
    <circle cx="1000" cy="135" r="2" class="box"/>
    <circle cx="1000" cy="165" r="2" class="box"/>
    <circle cx="1030" cy="150" r="2" class="box"/>
  </g>
