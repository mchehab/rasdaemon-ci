    <circle cx="650" cy="135" r="2" class="box"/>
    <circle cx="650" cy="165" r="2" class="box"/>
    <path d="M 650 133 V 67.5 H 679" marker-end="url(#arrow)"/>
    <path d="M 650 167 V 202.5 H 679" marker-end="url(#arrow)"/>
