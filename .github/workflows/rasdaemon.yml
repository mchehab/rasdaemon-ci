# SPDX-License-Identifier: GPL-2.0-only
name: Build RAS Daemon
on:
  workflow_call:
    inputs:
      arch:
        required: true
        type: string
      revision:
        required: true
        type: string
permissions:
  actions: read
  contents: read
jobs:
  build:
    name: Build RAS Daemon (${{ inputs.arch }})
    runs-on: ${{ inputs.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 360
    env:
      COMPONENT: rasdaemon
      ARCH: ${{ inputs.arch }}
      REVISION: ${{ inputs.revision }}
    steps:
      - uses: actions/checkout@v7
      - name: Check matching compiled artifact
        id: cache
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          key=$(python3 tests/qemu/ci/build-key.py "$COMPONENT")
          name="rasdaemon-$COMPONENT-$ARCH-$REVISION-$key"
          id=$(tests/qemu/ci/artifact.sh lookup "$name")
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "id=$id" >> "$GITHUB_OUTPUT"
          if test -n "$id"; then
            echo "Reuse $name (ID $id); compilation is not needed." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "Build $name: no matching compiled artifact exists." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/checkout@v7
        if: steps.cache.outputs.id == ''
        with:
          repository: mchehab/rasdaemon
          ref: ${{ inputs.revision }}
          path: rasdaemon-source
      - name: Build in the guest/runtime distribution
        if: steps.cache.outputs.id == ''
        run: |
          set -euxo pipefail
          docker build --build-arg "TEST_ARCH=$ARCH" -f tests/qemu/oci/Containerfile.build -t rasdaemon-builder tests/qemu/oci
          docker run --rm -v "$PWD:/workspace" rasdaemon-builder tests/qemu/ci/build-rasdaemon.sh "$ARCH" rasdaemon-source build/rasdaemon
      - uses: actions/upload-artifact@v7
        if: steps.cache.outputs.id == ''
        id: upload
        with:
          name: ${{ steps.cache.outputs.name }}
          path: build/rasdaemon
          retention-days: 30
          if-no-files-found: error
      - name: Record the selected artifact for this run
        env:
          ARTIFACT_ID: ${{ steps.cache.outputs.id || steps.upload.outputs.artifact-id }}
        run: |
          set -euxo pipefail
          mkdir -p selected
          jq -n --arg id "$ARTIFACT_ID" --arg revision "$REVISION" \
            '{id: $id, revision: $revision}' > "selected/$COMPONENT.json"
      - uses: actions/upload-artifact@v7
        with:
          name: selected-rasdaemon-${{ inputs.arch }}
          path: selected/
          retention-days: 14
          overwrite: true
          if-no-files-found: error
