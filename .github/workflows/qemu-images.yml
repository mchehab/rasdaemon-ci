# SPDX-License-Identifier: GPL-2.0-only

name: Build Linux kernel artifact

on:
  push:
    branches: [main]
  # TODO: restore the release-check schedule after the first end-to-end job succeeds.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64]
    steps:
      - uses: actions/checkout@v6
      - name: Install kernel builders
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex dwarves \
            libelf-dev libssl-dev git
      - name: Resolve latest Linux release
        id: source
        run: |
          python3 tests/qemu/source_refs.py resolve-kernel --channel release > kernel.json
          ref=$(python3 -c 'import json; print(json.load(open("kernel.json"))["commit"])')
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - name: Build kernel
        run: |
          tests/qemu/ci/build-kernel.sh --ref '${{ steps.source.outputs.ref }}' \
            --output build/kernel
      - uses: actions/upload-artifact@v4
        with:
          name: rasdaemon-kernel-${{ matrix.arch }}
          path: build/kernel
          if-no-files-found: error
