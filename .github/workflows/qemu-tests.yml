# SPDX-License-Identifier: GPL-2.0-only

name: RAS Daemon functional tests

on:
  workflow_call:
    inputs:
      image:
        required: true
        type: string
      arm-image:
        required: true
        type: string

  workflow_dispatch:
    inputs:
      image:
        description: Published QEMU image reference
        required: false
        type: string
      arm-image:
        description: Published arm64 QEMU image reference
        required: false
        type: string

  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: read

concurrency:
  group: qemu-tests-${{ github.sha }}
  cancel-in-progress: true

jobs:
  source:
    name: Pin source for both architectures
    runs-on: ubuntu-24.04
    outputs:
      revision: ${{ steps.source.outputs.revision }}
    steps:
      - name: Resolve rasdaemon revision
        id: source
        run: |
          set -euxo pipefail
          revision=$(git ls-remote https://github.com/mchehab/rasdaemon.git refs/heads/master | awk '{print $1}')
          test "${#revision}" -eq 40
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

  test:
    name: Test QEMU
    needs: source
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    env:
      IMAGE_REF: ${{ (matrix.arch == 'aarch64' && (inputs.arm-image || format('ghcr.io/{0}/rasdaemon-ci:aarch64', github.repository_owner))) || inputs.image || format('ghcr.io/{0}/rasdaemon-ci:x86_64', github.repository_owner) }}
    steps:
      - name: Check out rasdaemon source
        uses: actions/checkout@v7
        with:
          repository: mchehab/rasdaemon
          ref: ${{ needs.source.outputs.revision }}
          path: rasdaemon-source

      - name: Record tested rasdaemon revision
        env:
          TEST_ARCH: ${{ matrix.arch }}
        run: |
          set -eux

          mkdir -p "build/qemu-results/$TEST_ARCH"
          git -C rasdaemon-source rev-parse HEAD \
            > "build/qemu-results/$TEST_ARCH/rasdaemon-source-revision"

      - name: Download image
        run: |
          echo "Using image $IMAGE_REF"
          docker pull "$IMAGE_REF"
      - name: Run
        env:
          TEST_ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p build/qemu-results/$TEST_ARCH
          docker_args=(--rm)
          if test -r /dev/kvm && test -w /dev/kvm; then
            docker_args+=(--device /dev/kvm)
          fi
          docker run "${docker_args[@]}" \
            -v "$PWD/rasdaemon-source:/workspace:ro" \
            -v "$PWD/build/qemu-results/$TEST_ARCH:/results" \
            "$IMAGE_REF" \
            run --arch "$TEST_ARCH" --accelerator auto \
            --profile injection --timeout 3600

      - name: Publish kernel and rasdaemon status table
        if: always()
        env:
          TEST_ARCH: ${{ matrix.arch }}
        run: |
          set -eux

          if test -f "build/qemu-results/$TEST_ARCH/results.html"; then
            echo "Download rasdaemon-qemu-results-$TEST_ARCH and open results.html for feature and detailed results." >> "$GITHUB_STEP_SUMMARY"
          else
            echo '🔴 Infrastructure failure: no VM result table was produced.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v7
        name: Upload
        if: always()
        with:
          name: rasdaemon-qemu-results-${{ matrix.arch }}
          path: build/qemu-results/${{ matrix.arch }}
          retention-days: 90
          if-no-files-found: error
