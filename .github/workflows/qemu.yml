# SPDX-License-Identifier: GPL-2.0-only

name: Build QEMU artifact

on:
  push:
    branches: [main]
  # TODO: restore the release-check schedule after the first end-to-end job succeeds.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qemu:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64]
    steps:
      - uses: actions/checkout@v6
      - name: Install QEMU builders
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git meson ninja-build pkg-config \
            python3 python3-venv libglib2.0-dev libpixman-1-dev libslirp-dev \
            libfdt-dev libaio-dev liburing-dev libcap-ng-dev libseccomp-dev \
            libgnutls28-dev libudev-dev
      - name: Build QEMU
        run: |
          tests/qemu/ci/build-qemu.sh --ref rasdaemon_tests --output build/qemu
      - uses: actions/upload-artifact@v4
        with:
          name: rasdaemon-qemu-${{ matrix.arch }}
          path: build/qemu
          if-no-files-found: error
