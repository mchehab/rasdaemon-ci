name: rasdaemon QEMU functional test

on:
  workflow_dispatch:
    inputs:
      bundle_tag:
        description: Published bundle tag to run
        type: string
        default: release

permissions:
  contents: read
  packages: read

jobs:
  qemu-tcg:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64]
    steps:
      - uses: actions/checkout@v6
      - name: Check out pinned rasdaemon source
        env:
          LOCK_FILE: rasdaemon.lock.json
        run: |
          repository=$(python3 -c 'import json; print(json.load(open("rasdaemon.lock.json"))["repository"])')
          commit=$(python3 -c 'import json; print(json.load(open("rasdaemon.lock.json"))["commit"])')
          git clone --filter=blob:none --no-checkout "$repository" rasdaemon-source
          git -C rasdaemon-source fetch --depth=1 origin "$commit"
          git -C rasdaemon-source checkout --detach FETCH_HEAD
      - name: Run functional tests under TCG
        env:
          BUNDLE_TAG: ${{ inputs.bundle_tag || 'release' }}
          TEST_ARCH: ${{ matrix.arch }}
        run: |
          owner=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          image="ghcr.io/$owner/rasdaemon-ci:$BUNDLE_TAG"
          mkdir -p build/qemu-results/$TEST_ARCH
          docker pull "$image"
          docker run --rm \
            -v "$PWD/rasdaemon-source:/workspace:ro" \
            -v "$PWD/build/qemu-results/$TEST_ARCH:/results" \
            "$image" run --arch "$TEST_ARCH" --accelerator tcg \
            --profile injection --timeout 3600
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rasdaemon-qemu-${{ matrix.arch }}
          path: build/qemu-results/${{ matrix.arch }}
          if-no-files-found: error
