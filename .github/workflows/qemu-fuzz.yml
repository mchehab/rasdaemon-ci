# SPDX-License-Identifier: GPL-2.0-only
name: Fuzzy logic stress tests

on:
  schedule:
    - cron: "0 4 * * 0" # Sunday, 04:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rasdaemon-ci-pipeline
  cancel-in-progress: false

jobs:
  fuzz:
    name: Fuzz ${{ matrix.mode }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        mode: [random, zero, boundaries]
    steps:
      - name: Check out CI harness
        uses: actions/checkout@v7
        with:
          path: ci-harness
      - uses: actions/checkout@v7
        with:
          repository: mchehab/rasdaemon
          ref: master
          path: rasdaemon-source

      - name: Record tested rasdaemon revision
        env:
          FUZZ_MODE: ${{ matrix.mode }}
        run: |
          set -eux

          mkdir -p "build/fuzz/$FUZZ_MODE"
          git -C rasdaemon-source rev-parse HEAD \
            > "build/fuzz/$FUZZ_MODE/rasdaemon-source-revision"
          python3 ci-harness/tests/qemu/source_refs.py describe \
            --repository https://github.com/mchehab/rasdaemon.git \
            --commit "$(cat "build/fuzz/$FUZZ_MODE/rasdaemon-source-revision")" \
            > "build/fuzz/$FUZZ_MODE/rasdaemon-describe.json"

      - name: Run isolated fuzz VM
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/rasdaemon-ci:x86_64
          FUZZ_MODE: ${{ matrix.mode }}
          FUZZ_SEED: ${{ github.run_number }}
          FUZZ_COUNT: 1000
        run: |
          set -euxo pipefail
          docker pull "$IMAGE"
          mkdir -p "build/fuzz/$FUZZ_MODE"
          docker run --rm --entrypoint cat "$IMAGE" /opt/rasdaemon-ci/kernel/kernel.json > "build/fuzz/$FUZZ_MODE/kernel.json"
          docker run --rm --entrypoint cat "$IMAGE" /opt/rasdaemon-ci/qemu.json > "build/fuzz/$FUZZ_MODE/qemu.json"
          for component in kernel qemu; do
            python3 ci-harness/tests/qemu/source_refs.py describe-metadata \
              --metadata "build/fuzz/$FUZZ_MODE/$component.json" \
              > "build/fuzz/$FUZZ_MODE/$component-describe.json"
          done
          docker_args=(--rm)

          if test -r /dev/kvm && test -w /dev/kvm; then
            docker_args+=(--device /dev/kvm)
          fi

          container_source=$(docker run --rm --entrypoint /bin/sh "$IMAGE" \
            -c 'printf "%s/rasdaemon" "$HOME"')
          test "${container_source:0:1}" = /
          docker run "${docker_args[@]}" \
            -v "$PWD/ci-harness/tests/qemu:/opt/rasdaemon-ci/harness:ro" \
            -v "$PWD/ci-harness/tests/qemu/oci/rasdaemon-ci.py:/usr/local/bin/rasdaemon-ci:ro" \
            -v "$PWD/rasdaemon-source:$container_source:ro" \
            -e "RASDAEMON_SOURCE=$container_source" \
            -v "$PWD/build/fuzz/$FUZZ_MODE:/results" \
            "$IMAGE" run --arch x86_64 --accelerator auto \
            --profile fuzz --fuzz-mode "$FUZZ_MODE" --fuzz-seed "$FUZZ_SEED" \
            --fuzz-count "$FUZZ_COUNT" \
            --timeout 3600

      - name: Publish status table
        if: always()
        env:
          FUZZ_MODE: ${{ matrix.mode }}
        run: |
          set -eux

          python3 - "build/fuzz/$FUZZ_MODE/result.json" <<'PYTHON'
          import json
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          if path.is_file():
              data = json.loads(path.read_text())
              if data.get("infrastructure_failure"):
                  print("Infrastructure failure: " + data["infrastructure_failure"], flush=True)
              for test in data.get("tests", []):
                  if test["status"] == "failed":
                      print("FAIL " + test["name"] + ": " + test.get("reason", ""), flush=True)
                      if test.get("evidence"):
                          print(json.dumps(test["evidence"], indent=2)[-16384:], flush=True)
              if data.get("infrastructure_failure") or any(
                      test["status"] == "failed" for test in data.get("tests", [])):
                  for name in ("payload-build.log", "qemu.log", "console.log", "fuzz.log"):
                      log = path.parent / name
                      if log.is_file():
                          with log.open("rb") as stream:
                              stream.seek(max(0, log.stat().st_size - 16384))
                              tail = stream.read().decode("utf-8", errors="replace")
                          print(name + " (last 16384 bytes):\n" + tail, flush=True)
          else:
              print("Infrastructure failure: no result.json was produced", flush=True)
          PYTHON

          python3 - "build/fuzz/$FUZZ_MODE/result.json" \
            "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$FUZZ_MODE" \
            >> "$GITHUB_STEP_SUMMARY" <<'PYTHON'
          import json
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          repository, run_id, mode = sys.argv[2:]
          if not path.is_file():
              print(f"## {mode.capitalize()} fuzz results\n")
              print("Infrastructure failure: no VM result was produced.")
              raise SystemExit(0)

          data = json.loads(path.read_text())
          totals = data.get("totals", {})
          print(f"## {mode.capitalize()} fuzz results\n")
          print(f"VM status: **{data.get('vm_status', 'unavailable')}**. "
                f"Passed: {totals.get('passed', 0)}, "
                f"failed: {totals.get('failed', 0)}, "
                f"skipped: {totals.get('skipped', 0)}.\n")
          print("| Component | PASS | FAIL | SKIP | N/A |\n"
                "| --- | ---: | ---: | ---: | ---: |")
          for component, values in data.get("component_totals", {}).items():
              print(f"| {component} | {values.get('passed', 0)} | "
                    f"{values.get('failed', 0)} | {values.get('skipped', 0)} | "
                    f"{values.get('not_applicable', 0)} |")
          print(f"\n[Full report, corpus, and logs in the Actions run]"
                f"(https://github.com/{repository}/actions/runs/{run_id})")
          PYTHON

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: kernel-rasdaemon-fuzz-${{ matrix.mode }}-${{ github.run_number }}
          path: build/fuzz/${{ matrix.mode }}
          if-no-files-found: error
          retention-days: 90
