# SPDX-License-Identifier: GPL-2.0-only
name: RAS CI pipeline

# Single build/test entry point. Daily polling resolves rasdaemon master,
# QEMU rasdaemon_tests, and the latest Linux release or release candidate. Immediate upstream
# notifications require a source workflow or external webhook to send an
# upstream-changed repository dispatch; cross-repository pushes do not do so.
on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [upstream-changed]
  schedule:
    - cron: "0 0 * * *"

permissions:
  actions: write
  contents: read
  packages: write

# One running pipeline and one latest pending request. Never cancel active work.
# This lock belongs only to the caller, not to its reusable workflows.
# Weekly fuzz shares the lock. Independent source builds and architecture
# matrices remain parallel within a run.
concurrency:
  group: rasdaemon-ci-pipeline
  cancel-in-progress: false

jobs:
  source:
    name: Pin upstream sources for both architectures
    runs-on: ubuntu-26.04
    outputs:
      revision: ${{ steps.source.outputs.revision }}
      kernel: ${{ steps.source.outputs.kernel }}
      kernel-tag-object: ${{ steps.source.outputs.kernel-tag-object }}
      qemu: ${{ steps.source.outputs.qemu }}
    steps:
      - uses: actions/checkout@v7
      - name: Resolve upstream revisions
        id: source
        run: |
          set -euxo pipefail
          revision=$(git ls-remote https://github.com/mchehab/rasdaemon.git refs/heads/master | awk '{print $1}')
          test "${#revision}" -eq 40
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          qemu=$(git ls-remote https://gitlab.com/mchehab_kernel/qemu.git refs/heads/rasdaemon_tests | awk '{print $1}')
          test "${#qemu}" -eq 40
          echo "qemu=$qemu" >> "$GITHUB_OUTPUT"
          python3 tests/qemu/source_refs.py resolve-kernel --channel latest > kernel.json
          kernel=$(jq -r .commit kernel.json)
          test "${#kernel}" -eq 40
          echo "kernel=$kernel" >> "$GITHUB_OUTPUT"
          echo "kernel-tag-object=$(jq -r .tag_object kernel.json)" >> "$GITHUB_OUTPUT"

  architecture:
    name: ${{ matrix.arch }}
    needs: source
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    uses: ./.github/workflows/architecture.yml
    with:
      arch: ${{ matrix.arch }}
      revision: ${{ needs.source.outputs.revision }}
      kernel: ${{ needs.source.outputs.kernel }}
      kernel-tag-object: ${{ needs.source.outputs.kernel-tag-object }}
      qemu: ${{ needs.source.outputs.qemu }}
    secrets: inherit
