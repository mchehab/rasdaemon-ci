# SPDX-License-Identifier: GPL-2.0-only
name: Build QEMU test image
on:
  workflow_call:
    inputs:
      arch:
        required: true
        type: string
permissions:
  actions: read
  contents: read
  packages: write
jobs:
  build:
    name: Build QEMU image (${{ inputs.arch }})
    runs-on: ${{ inputs.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 180
    env:
      TEST_ARCH: ${{ inputs.arch }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: selected-kernel-${{ inputs.arch }}
          path: selected/
      - uses: actions/download-artifact@v7
        with:
          name: selected-qemu-${{ inputs.arch }}
          path: selected/
      - name: Check Debian base checksum
        id: base
        run: |
          sha=$(curl --fail --location --retry 3 \
            https://cloud.debian.org/images/cloud/trixie/latest/SHA512SUMS | \
            awk '$2 == "debian-13-genericcloud-${{ inputs.arch == 'aarch64' && 'arm64' || 'amd64' }}.qcow2" {print $1; exit}')
          test -n "$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Check matching image
        id: cache
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          set -euxo pipefail
          kernel=$(jq -r .id selected/kernel.json)
          qemu=$(jq -r .id selected/qemu.json)
          key=$(python3 tests/qemu/ci/build-key.py image)
          name="rasdaemon-image-$TEST_ARCH-$kernel-$qemu-$key-$BASE_SHA"
          id=$(tests/qemu/ci/artifact.sh lookup "$name")
          if test -n "$id"; then
            tests/qemu/ci/artifact.sh download "$id" build/image
            image=$(cat build/image/reference)
            owner=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
            if [[ "$image" != "ghcr.io/$owner/rasdaemon-ci@sha256:"* ]] || ! docker pull "$image"; then
              echo "Cached image is unavailable; assemble it again."
              id=
            fi
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          if test -n "$id"; then
            echo "Reuse image $image; no image build needed." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "Build image from kernel ID $kernel and QEMU ID $qemu." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Download selected compiled artifacts
        if: steps.cache.outputs.id == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          tests/qemu/ci/artifact.sh download "$(jq -r .id selected/kernel.json)" build/kernel
          tests/qemu/ci/artifact.sh download "$(jq -r .id selected/qemu.json)" build/qemu
          tar -xf build/kernel/kernel.tar -C build/kernel
          tar -xf build/qemu/qemu.tar -C build/qemu
          jq -e --arg revision "$(jq -r .revision selected/kernel.json)" '.commit == $revision' build/kernel/metadata/kernel.json
          jq -e --arg revision "$(jq -r .revision selected/qemu.json)" '.commit == $revision' build/qemu/metadata/qemu.json
      - name: Install dependencies
        if: steps.cache.outputs.id == ''
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-system-arm qemu-efi-aarch64 \
            qemu-utils cloud-image-utils e2fsprogs python3 jq unzip curl

      - name: Build image
        if: steps.cache.outputs.id == ''
        run: |
          tests/qemu/ci/build-bundle.sh --arch "$TEST_ARCH" \
            --kernel-dir build/kernel --qemu-dir build/qemu \
            --kernel-json build/kernel/metadata/kernel.json \
            --base-sha512 '${{ steps.base.outputs.sha }}' \
            --tag "rasdaemon-ci:$TEST_ARCH"

      - name: Publish image
        if: steps.cache.outputs.id == ''
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          owner=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          repository="ghcr.io/$owner/rasdaemon-ci"
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          set -x
          docker tag "rasdaemon-ci:$TEST_ARCH" "$repository:$TEST_ARCH"
          docker push "$repository:$TEST_ARCH"
          # Local images can have several RepoDigests. Select the pushed registry,
          # not Docker's first entry (which may be an unqualified local name).
          image=$(docker image inspect "$repository:$TEST_ARCH" | jq -er --arg repository "$repository" \
            '.[0].RepoDigests | map(select(startswith($repository + "@sha256:"))) | first')
          docker pull "$image"
          mkdir -p build/image
          printf '%s\n' "$image" > build/image/reference
      - uses: actions/upload-artifact@v7
        if: steps.cache.outputs.id == ''
        with:
          name: ${{ steps.cache.outputs.name }}
          path: build/image/reference
          retention-days: 30
          if-no-files-found: error
      - name: Make the tested image available to this run
        uses: actions/upload-artifact@v7
        with:
          name: selected-image-${{ inputs.arch }}
          path: build/image/reference
          retention-days: 14
          overwrite: true
          if-no-files-found: error
      - name: Upload image diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rasdaemon-qemu-image-diagnostics-${{ inputs.arch }}
          path: build/rasdaemon-ci/**/*.console.log
          retention-days: 90
          if-no-files-found: ignore

